name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # VentanaPrincipal extends JFrame, so some tests need a real display
      # to construct Swing components. xvfb-run gives the runner a virtual
      # one; those tests skip themselves gracefully if it's unavailable.
      - name: Install Xvfb (virtual display for Swing tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build and test with Maven
        if: hashFiles('pom.xml') != ''
        run: xvfb-run -a mvn -B package

      - name: Upload built jar
        if: hashFiles('pom.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tres-en-linea-jar
          path: target/*.jar

      # pom.xml lands via the test-adding branches; until those are merged,
      # fall back to a plain compile check so this workflow is still useful
      # on its own.
      - name: Fallback build with javac (no pom.xml yet)
        if: hashFiles('pom.xml') == ''
        run: |
          mkdir -p bin
          javac -encoding UTF-8 -d bin src/main/java/main/Main.java src/main/java/logica/*.java src/main/java/presentacion/*.java
